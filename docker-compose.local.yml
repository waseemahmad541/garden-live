services:
  garden-live-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: garden_live
      POSTGRES_USER: garden_live
      POSTGRES_PASSWORD: garden_live_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - garden_live_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden_live -d garden_live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  garden_live_local_postgres_data:
